<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudySync – Study group</title>
  <link rel="stylesheet" href="/public/style.css">
  <link rel="stylesheet" href="/public/dashboard.css">
  <link rel="stylesheet" href="/public/landing.css">
</head>
<body>
  <div class="box wide">
    <header class="page-head">
      <div>
        <h1 id="group-name">Study group</h1>
        <p id="group-when"></p>
      </div>
      <nav class="head-links" aria-label="Pages">
        <a href="/landing" class="head-link icon-text-link">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          <span>Back to study plan</span>
        </a>
        <a href="/logout" class="head-link icon-text-link">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Log out</span>
        </a>
      </nav>
    </header>

    <p id="load-error" class="error" hidden></p>

    <div id="group-body" hidden>
      <section>
        <h2>Members</h2>
        <ul id="group-members" class="member-list"></ul>
      </section>

      <section>
        <h2>Group notes</h2>
        <p class="hint">Everyone in the group can see these notes. You can delete the ones you added.</p>

        <form id="note-form" class="note-form">
          <label>Title
            <input id="note-title" type="text" maxlength="120" required placeholder="e.g. Chapter 4 review">
          </label>
          <label>Note
            <textarea id="note-body" rows="5" maxlength="20000" required placeholder="Write or paste your notes here"></textarea>
          </label>
          <p id="note-error" class="error" hidden></p>
          <button type="submit" id="note-submit">Add note</button>
        </form>

        <p id="notes-empty" class="hint" hidden>No notes yet. Add the first one!</p>
        <div id="notes" class="note-list"></div>
      </section>
    </div>
  </div>

  <script src="/public/group.js"></script>
</body>
</html>
