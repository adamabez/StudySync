<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <title>StudySync – Account settings</title>
  <script src="/public/theme.js"></script>
  <link rel="stylesheet" href="/public/style.css">
  <link rel="stylesheet" href="/public/dashboard.css">
  <link rel="stylesheet" href="/public/landing.css">
  <link rel="stylesheet" href="/public/feedback.css">
  <link rel="stylesheet" href="/public/dark.css">
</head>
<body>
  <div class="box wide account-page">
    <header class="page-head">
      <div>
        <h1><a href="/landing" class="logo-link" title="Go to your study plan" aria-label="StudySync: go to your study plan"><img src="/public/logo.png" alt="StudySync" class="logo"></a></h1>
        <p id="account-email-line">Account settings</p>
      </div>
      <nav class="head-links" aria-label="Pages">
        <a href="/dashboard" class="head-link icon-text-link">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="/logout" class="head-link icon-text-link">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Log out</span>
        </a>
      </nav>
    </header>

    <!-- Appearance: per device, saved in this browser -->
    <section class="settings-card">
      <h2>Appearance</h2>
      <div class="segmented theme-choice" role="radiogroup" aria-label="Theme">
        <label><input type="radio" name="theme" value="system"> Match my device</label>
        <label><input type="radio" name="theme" value="light"> Light</label>
        <label><input type="radio" name="theme" value="dark"> Dark</label>
      </div>
      <p class="hint">Saved on this device.</p>
    </section>

    <section class="settings-card">
      <h2>Email</h2>
      <p class="hint">You log in with <strong id="current-email">your email</strong>.</p>
      <form id="email-form" class="settings-form">
        <label>New email
          <input id="new-email" type="email" autocomplete="email" required>
        </label>
        <label>Current password
          <input id="email-password" type="password" autocomplete="current-password" required>
        </label>
        <p id="email-message" class="form-message" hidden></p>
        <button type="submit">Change email</button>
      </form>
    </section>

    <section class="settings-card">
      <h2>Password</h2>
      <form id="password-form" class="settings-form">
        <label>Current password
          <input id="current-password" type="password" autocomplete="current-password" required>
        </label>
        <label>New password
          <input id="new-password" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <p id="password-message" class="form-message" hidden></p>
        <button type="submit">Change password</button>
      </form>
    </section>

    <section class="settings-card danger-zone">
      <h2>Delete account</h2>
      <p class="hint">This permanently deletes your account, schedule, course materials, saved chats
        and notes, and removes you from your study groups. It can't be undone.</p>
      <form id="delete-form" class="settings-form">
        <label>Current password
          <input id="delete-password" type="password" autocomplete="current-password" required>
        </label>
        <label><span>Type <strong>DELETE</strong> to confirm</span>
          <input id="delete-confirm" autocomplete="off" required>
        </label>
        <p id="delete-message" class="form-message" hidden></p>
        <button type="submit" class="danger-button">Delete my account</button>
      </form>
    </section>
  </div>

  <script src="/public/account.js"></script>
  <script src="/public/feedback.js"></script>
</body>
</html>
