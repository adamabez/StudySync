<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <script src="/public/theme.js"></script>
  <title>StudySync – New password</title>
  <link rel="stylesheet" href="/public/style.css">
  <link rel="stylesheet" href="/public/dark.css">
</head>
<body>
  <div class="box">
    <h1><img src="/public/logo.png" alt="StudySync" class="logo"></h1>
    <p>Choose a new password</p>
    <form id="reset-form" hidden>
      <label>New password
        <input id="password" type="password" autocomplete="new-password" minlength="6" required autofocus>
      </label>
      <p id="reset-error" class="error" hidden></p>
      <button type="submit">Save and log in</button>
    </form>
    <p id="link-problem" class="error" hidden></p>
    <p class="switch"><a href="/forgot">Send a new link</a> · <a href="/">Back to log in</a></p>
  </div>

  <script>
    // The link in the email brings you here with a short-lived login after the #:
    //   /reset-password#access_token=...&refresh_token=...&type=recovery
    // (or #error_description=... if the link is used up or expired)
    const hash = new URLSearchParams(location.hash.slice(1));
    const accessToken = hash.get("access_token");
    const refreshToken = hash.get("refresh_token");
    history.replaceState(null, "", location.pathname); // don't leave the login sitting in the address bar

    const MESSAGES = {
      expired: "This reset link has expired or was already used. Send a new one.",
      weak: "Pick a stronger password (at least 6 characters).",
      same: "That's your current password. Pick a different one.",
      unreachable: "Couldn't reach the login service. Check your connection and try again.",
    };

    function showLinkProblem(message) {
      const problem = document.getElementById("link-problem");
      problem.textContent = message;
      problem.hidden = false;
    }

    if (hash.get("error_description")) {
      showLinkProblem(MESSAGES.expired);
    } else if (!accessToken || !refreshToken) {
      showLinkProblem("Open this page from the link in your password reset email.");
    } else {
      const form = document.getElementById("reset-form");
      const error = document.getElementById("reset-error");
      form.hidden = false;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.hidden = true;
        const res = await fetch("/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accessToken, refreshToken, password: document.getElementById("password").value }),
        }).catch(() => null);
        const data = res ? await res.json().catch(() => ({})) : { error: "unreachable" };
        if (res && res.ok) return (window.location.href = "/home");
        if (data.error === "expired") {
          form.hidden = true;
          return showLinkProblem(MESSAGES.expired);
        }
        error.textContent = MESSAGES[data.error] || "Something went wrong. Try again.";
        error.hidden = false;
      });
    }
  </script>
</body>
</html>
