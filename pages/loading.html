<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <script src="/public/theme.js"></script>
  <title>StudySync – Loading</title>
  <link rel="stylesheet" href="/public/style.css">
  <link rel="stylesheet" href="/public/dark.css">
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Loading StudySync…</p>
  </div>

  <script>
    const LOADING_TIME_MS = 1750; // how long the spinner shows before moving on
    setTimeout(() => { window.location.href = "/start"; }, LOADING_TIME_MS);
  </script>
</body>
</html>
