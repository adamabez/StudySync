<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <!-- Installable as an app: public/manifest.webmanifest, public/install.js -->
  <link rel="manifest" href="/public/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/public/apple-touch-icon.png">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="StudySync">
  <script src="/public/install.js" defer></script>
  <script src="/public/theme.js"></script>
  <title>StudySync – Offline</title>
  <link rel="stylesheet" href="/public/style.css">
  <link rel="stylesheet" href="/public/dark.css">
</head>
<body>
  <!-- Shown by the service worker (public/sw.js) when a page can't load without a connection -->
  <div class="box">
    <h1><img src="/public/logo.png" alt="StudySync" class="logo"></h1>
    <p>You're offline. StudySync needs a connection to load your schedule and study groups.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
